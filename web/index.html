<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    The engine installs its own viewport tag once it has loaded and replaces
    this one. Until then, without it, a phone lays the page out 980 px wide:
    the loading screen comes out tiny and the "turn your phone" prompt cannot
    match its width rule.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Courier Dash: a one-button endless runner about an on-foot delivery courier. Tap to hop, hold to leap, keep your packages.">
  <meta name="theme-color" content="#10151C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Courier Dash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Courier Dash</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Dark from the first paint: no white flash while the engine downloads. */
    html, body {
      height: 100%;
      margin: 0;
      background: #10151C;
      overflow: hidden;
      /* The game is played by tapping and holding. None of the browser's own
         reactions to that (text selection, the long-press callout, the tap
         flash, pull-to-refresh) belong on this page. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .shell-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      box-sizing: border-box;
      background: #10151C;
      color: #ECF0F1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    /* Shown until Flutter paints its first frame. */
    #loading { z-index: 1; transition: opacity 0.25s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    /* The app icon. Space is held for it so the title does not jump when it
       arrives, and it is dropped on a screen too short to spare the room. */
    #loading img { display: block; width: 84px; height: 84px; margin-bottom: 4px; }
    @media (max-height: 300px) { #loading img { display: none; } }
    #loading h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    #loading p { margin: 0; font-size: 14px; color: #85C1E9; }
    #loading .track {
      width: 180px;
      height: 6px;
      border-radius: 3px;
      background: #1C2833;
      overflow: hidden;
    }
    #loading .track::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #E67E22;
      animation: courier-run 1.1s ease-in-out infinite;
    }
    @keyframes courier-run {
      from { transform: translateX(-110%); }
      to { transform: translateX(260%); }
    }

    /* The game is landscape-only: on a phone held upright it would be a thin
       strip. Ask for a turn, but never trap a player whose rotation is locked. */
    #rotate { display: none; z-index: 2; }
    #rotate .phone {
      width: 46px;
      height: 78px;
      border: 4px solid #ECF0F1;
      border-radius: 10px;
      animation: turn-phone 2.2s ease-in-out infinite;
    }
    #rotate h2 { margin: 6px 0 0; font-size: 22px; font-weight: 800; }
    #rotate p { margin: 0; font-size: 14px; color: #AAB7B8; max-width: 260px; }
    #rotate button {
      margin-top: 8px;
      padding: 10px 18px;
      border: 2px solid #5D6D7E;
      border-radius: 10px;
      background: transparent;
      color: #ECF0F1;
      font: inherit;
      font-size: 14px;
    }
    @keyframes turn-phone {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (max-width: 640px) {
      #rotate:not(.dismissed) { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .track::after, #rotate .phone { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" class="shell-screen" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="84" height="84">
    <h1>COURIER DASH</h1>
    <p>Loading the city&hellip;</p>
    <div class="track"></div>
  </div>

  <div id="rotate" class="shell-screen">
    <div class="phone" aria-hidden="true"></div>
    <h2>Turn your phone sideways</h2>
    <p>Courier Dash is played in landscape.</p>
    <button id="rotate-dismiss" type="button">Play upright anyway</button>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 400);
    });
    // A long press (the "hold to leap" input) or a right-click must not open
    // the browser's menu over a live run.
    window.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });
    document.getElementById('rotate-dismiss').addEventListener('click', function () {
      document.getElementById('rotate').classList.add('dismissed');
      // The button that held focus is hidden now. Hand the keyboard back to
      // the game, or key presses go nowhere until the player clicks it.
      var view = document.querySelector('flutter-view');
      if (view) { view.focus(); }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
