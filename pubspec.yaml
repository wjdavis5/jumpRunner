name: jump_runner
description: A 2D horizontal scrolling courier runner game built with Flutter and Flame
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.11.0
  flame_audio: ^2.11.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/courier/
    - assets/images/environment/
    - assets/images/hazards/
    - assets/images/pickups/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/LICENSE_KENNEY.txt
    - assets/fonts/LICENSE_ROBOTO.txt

  # The font is carried in the app so that every platform draws the same
  # letters at the same weights. Without it the web build fetched one weight
  # from a font server and faked the bold ones, and iOS used its own font.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
