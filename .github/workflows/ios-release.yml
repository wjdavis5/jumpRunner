name: iOS Release

# Builds, signs, and delivers iOS TestFlight and App Store releases.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the build for App Store review'
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: com.wjdavis5.jump_runner
  FLUTTER_CHANNEL: stable

jobs:
  verify:
    name: Verify Codebase
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze & Test
        run: |
          flutter analyze --fatal-infos
          flutter test

  release-ios:
    name: Build & Ship iOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Fastlane & Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Setup Keychain & Certificates
        if: env.IOS_DIST_CERT_P12_BASE64 != ''
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=temporal-secret

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_P12=$RUNNER_TEMP/certificate.p12
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Fastlane Delivery
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          cd fastlane && fastlane beta
